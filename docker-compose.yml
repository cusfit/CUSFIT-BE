services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cusfit-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-cusfit}
      POSTGRES_USER: ${DB_USERNAME:-cusfit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cusfit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cusfit-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres-data:
